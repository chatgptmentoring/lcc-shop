<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thank you</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;600;700&display=swap"><style>:root{--bg:#F5F8FA;--surface:#FFFFFF;--text:#2A2A2A;--muted:#A3A3A3;--accent:#4D9E9E;--accent-text:#FFFFFF}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.65;font-family:'Open Sans',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}h1,h2{font-family:'Montserrat',-apple-system,Segoe UI,sans-serif}.w{max-width:760px;margin:0 auto;padding:40px 20px}.brand{color:var(--accent);letter-spacing:.12em;font-size:12px;text-transform:uppercase}h1{font-size:clamp(30px,6vw,44px);line-height:1.15;margin:14px 0}h2{margin-top:36px}.sub{font-size:19px;color:var(--muted)}li{margin:8px 0}img{max-width:100%;height:auto;border-radius:14px}.box{background:var(--surface);border-radius:14px;padding:24px;margin:28px 0}button,.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:15px 26px;font-size:17px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}input{width:100%;padding:13px;border-radius:10px;border:1px solid var(--muted);background:var(--bg);color:var(--text);font-size:16px;margin:10px 0 14px}.small{font-size:13px;color:var(--muted)}details{background:var(--surface);border-radius:10px;padding:12px 16px;margin:8px 0}table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--muted);padding:8px;text-align:left}</style></head><body><div class="w"><div class="brand">Client Magnet Audit</div><h1>Thank you.</h1><p class="sub">Your payment for Web Presence Audit went through. Your audit report will arrive by email shortly.</p></div></body></html>
